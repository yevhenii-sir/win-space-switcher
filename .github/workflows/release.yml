# Builds the executable for a pushed version tag (v1.2.3) and attaches it to a draft release.
# Review the draft on GitHub, edit the notes and publish it by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\win-space-switcher.exe dist\WinSpaceSwitcher.exe
          $hash = (Get-FileHash dist\WinSpaceSwitcher.exe -Algorithm SHA256).Hash
          "SHA256 ``WinSpaceSwitcher.exe``: ``$hash``" | Set-Content dist\notes.md -Encoding utf8

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist\WinSpaceSwitcher.exe
          --draft --verify-tag --title "${{ github.ref_name }}" --notes-file dist\notes.md
